# Defaults, bounds, labels and citations. No formulas live in the UI.
meta:
  base_year: 2025
  target_year_2030: 2030
  netzero_year: 2040
  target_band: [0.10, 0.14]   # Alaska 2030 intensity reduction vs 2019

# User-facing scenario inputs: default, min, max, step, label, help
inputs:
  saf_share_2030:   {default: 0.10, min: 0.0,  max: 0.50, step: 0.01, label: "SAF share 2030",  help: "Share of liquid jet fuel from SAF in 2030.", fmt: "pct", group: "SAF"}
  saf_share_2040:   {default: 0.60, min: 0.0,  max: 1.00, step: 0.05, label: "SAF share 2040",  help: "Share of liquid jet fuel from SAF in 2040.", fmt: "pct", group: "SAF"}
  saf_premium:      {default: 1.00, min: 0.0,  max: 3.00, step: 0.05, label: "SAF price premium", help: "Market SAF price premium over conventional jet fuel. No transparent SAF spot price exists.", fmt: "pct", group: "SAF"}
  partner_share:    {default: 0.00, min: 0.0,  max: 1.00, step: 0.05, label: "Partner-funded share of premium", help: "Scope 3 / book-and-claim support. Shifts cost, not physical SAF use.", fmt: "pct", group: "SAF"}
  fleet_renewal:    {default: 0.00, min: 0.0,  max: 1.00, step: 0.05, label: "Fleet renewal by 2040", help: "Incremental beyond the EIA efficiency baseline. 0% avoids double counting.", fmt: "pct", group: "Operations"}
  ground_elec:      {default: 0.00, min: 0.0,  max: 1.00, step: 0.05, label: "Ground electrification by 2040", help: "Share of Scope 1 vehicle emissions removed. Ceiling is small by construction: ground vehicles are 0.28% of the 2040 operational residual, so even 100% electrification removes ~20k t (~$4M at $200/t). Included for completeness, not leverage.", fmt: "pct", group: "Operations"}
  novel_propulsion: {default: 0.00, min: 0.0,  max: 0.50, step: 0.05, label: "Novel propulsion by 2040", help: "Zero-carbon propulsion proxy displacing liquid-fuel activity.", fmt: "pct", group: "Operations"}
  catalytic_pct:    {default: 0.00, min: 0.0,  max: 0.05, step: 0.005, label: "Catalytic capital (% revenue)", help: "Strategic investment that adds US SAF capacity after a 3-year lag. Supply effect only, and supply only affects emissions when it BINDS - if the scenario is not already supply-constrained, this spends money and abates nothing. Check the SAF supply tab for a non-zero gap before spending here.", fmt: "pct", group: "Money"}
  investable_pct:   {default: 0.03, min: 0.0,  max: 0.10, step: 0.005, label: "Investable cash (% revenue)", help: "Explicit budget assumption. 2025 OCF/revenue was 8.4%, but OCF also funds normal capex, debt service and working capital, so only part of it is investable in decarbonization.", fmt: "pct", group: "Money", visible: false}
  activity_adj:     {default: 0.00, min: -0.03, max: 0.03, step: 0.005, label: "Activity vs FAA (%/yr)", help: "0% = FAA system ASM baseline.", fmt: "pct", group: "Baselines"}
  efficiency_adj:   {default: 0.00, min: -0.02, max: 0.02, step: 0.005, label: "Efficiency vs EIA (%/yr)", help: "0% = EIA aircraft-efficiency baseline.", fmt: "pct", group: "Baselines"}
  saf_supply_case:  {default: "Base", options: ["Base", "Conservative"], label: "US SAF supply case", help: "Base = Rystad 190k bpd 2035; Conservative = 110k bpd.", fmt: "choice", group: "Baselines", visible: false}
  post_2035_growth: {default: 0.10, min: 0.0,  max: 0.20, step: 0.01, label: "Post-2035 SAF growth (%/yr)", help: "Growth after the last published 2035 anchor. 0% is a stress-test floor, not a neutral choice - it asserts US SAF production physically flatlines for five years, which no policy or project pipeline supports. Use ~1%/yr as a conservative floor; 0% only to test fragility.", fmt: "pct", group: "Baselines"}
  carbon_price:     {default: 200,  min: 25,   max: 500,  step: 25,   label: "Carbon planning price ($/t)", help: "Single planning price on modeled 2040 residual. CORSIA midpoint reference is $59/t; durable removal benchmark is $200/t.", fmt: "usd", group: "Baselines"}
  carbon_escalation: {default: 0.00, min: 0.0, max: 0.10, step: 0.005, label: "Carbon price escalation (%/yr)", help: "Real growth in the carbon planning price as cheap credits are exhausted. 0% reproduces the workbook's single flat price. The reference pathways use 3.3%/yr, the rate that brings $200/t up to SAF's own $324/t by 2040.", fmt: "pct", group: "Baselines"}
  removal_growth:   {default: 0.00, min: 0.0,  max: 0.60, step: 0.05, label: "Durable removal market growth (%/yr)", help: "Growth of the durable carbon removal market from its observed Aug/Sep 2026 volume. 0% avoids hidden extrapolation; there is no published forward supply anchor, so this is yours to set. Presentational only - it never constrains the model.", fmt: "pct", group: "Baselines"}

# Reference pathways for the projection chart's three-way toggle.
#
# NOT workbook data. Every value under `overrides` is a scenario assumption asserted
# from OUTSIDE Alaska_Airlines_Model_Revenue_Anchored_v3.xlsx, agreed in session on
# 2026-09-21. They live here, beside the inputs they set, so the chart's claims stay
# auditable rather than buried in chart code. Keys are ScenarioInputs fields; anything
# unlisted keeps its default above. BAU and Conservative carry no overrides because
# both are derived - see core.bau_reference() and core._conservative_saf_ramp().
references:
  bau:
    label: "Business as usual"
    note: >-
      FAA activity and EIA efficiency as published, SAF flat at its 2025 share, and none
      of Alaska's own levers.
    overrides: {}
  conservative:
    label: "Conservative"
    note: >-
      Meets the 2030 floor on SAF alone, then holds that same ramp rate out to 2040
      instead of accelerating, and never invests ahead of the curve.
    overrides:
      carbon_escalation: 0.033
  all_in:
    label: "All-In"
    note: >-
      Invests 2% of revenue in catalytic capital from the start, which buys a compounding
      2%/yr decline in both the SAF premium and the carbon price once it matures, and
      partners carry 20% of the premium that is left. The price declines are earned by the
      spending rather than assumed, so this pathway pays before it saves. Fleet, ground and
      propulsion move only marginally because their capex is not modeled and maxing free
      levers would flatter the result.
    overrides:
      saf_share_2030: 0.15
      saf_share_2040: 0.90
      partner_share: 0.20
      catalytic_pct: 0.02
      fleet_renewal: 0.20
      ground_elec: 0.25
      novel_propulsion: 0.05
      carbon_escalation: 0.033

# Backend anchors. Not user-editable.
anchors:
  saf_lifecycle_reduction: 0.80      # Alaska: SAF can cut lifecycle emissions up to ~80%
  fleet_fuel_advantage: 0.20         # newer aircraft ~15-25% more efficient per seat; midpoint proxy
  neutralization_share: 1.00         # share of 2040 residual neutralized
  saf_capital_intensity: 14.6666666667  # $ per annual gallon of capacity (DOE: >$44B for >3B gal/yr)
  catalytic_lag_years: 3
  # NEW, not from the workbook: catalytic capital buys a compounding price decline.
  # Multiplier on catalytic_pct, so 1% of revenue invested buys a 1%/yr decline in
  # BOTH the SAF premium and the carbon price, compounding after catalytic_lag_years.
  # Exactly 1.0 (no effect) whenever catalytic_pct is 0, which keeps workbook parity.
  catalytic_learning_rate: 1.0
  saf_2030_probable: 2048980612      # peer-reviewed probable production
  saf_2035_base: 2912700000          # Rystad base 190k bpd
  saf_2035_conservative: 1686300000  # Rystad low 110k bpd
  saf_2025_actual: 287728509         # EPA RFS full-year actual
  corsia_reference_price: 59
  removal_benchmark_price: 200

sources:
  FAA Aerospace Forecast: https://www.faa.gov/data_research/aviation/aerospace_forecasts/FY_2026-2046_Full_Forecast_Document_Tables.pdf
  EIA Annual Energy Outlook: https://www.eia.gov/outlooks/aeo/
  DOE SAF Liftoff: https://www.energy.gov/articles/us-department-energy-releases-new-report-pathways-commercial-liftoff-sustainable-aviation
  SAF 2030 probable production: https://www.sciencedirect.com/science/article/pii/S0961953425009274
  Rystad 2035 SAF cases: https://www.rystadenergy.com/news/booming-biofuels-us-diesel-sustainable-aviation-fuel
  MSCI CORSIA costs: https://www.msci.com/research-and-insights/paper/corsia-costs-and-implications-for-the-airline-industry
  EPA RFS renewable jet: https://www.epa.gov/fuels-registration-reporting-and-compliance-help/spreadsheet-rin-generation-and-renewable-fuel-0
  Nasdaq/Puro carbon removal: https://www.nasdaq.com/products/european-markets/carbon-removal-platform
